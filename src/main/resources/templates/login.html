<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AgroGestão Web</title>

    <link rel="stylesheet" th:href="@{/style.css}" href="/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: var(--color-bg, #F5F0E6);
            padding: 1.5rem;
            margin: 0;
        }
        .login-card {
            width: 100%;
            max-width: 440px;
            background: #ffffff;
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(30, 59, 47, 0.12);
            padding: 2.5rem;
            border: 1px solid rgba(127, 140, 106, 0.25);
        }
        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .login-icon {
            width: 58px;
            height: 58px;
            background-color: #1E3B2F;
            color: #C8B48A;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            margin-bottom: 1rem;
        }
        .login-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1E3B2F;
            margin: 0 0 0.35rem 0;
        }
        .login-subtitle {
            font-size: 0.88rem;
            color: #64748b;
            margin: 0;
        }
        .alert-box {
            padding: 0.85rem 1rem;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 1.25rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }
        .alert-danger {
            background-color: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }
        .alert-success {
            background-color: #f0fdf4;
            color: #166534;
            border: 1px solid #bbf7d0;
        }
        .credentials-hint {
            margin-top: 1.75rem;
            padding-top: 1.25rem;
            border-top: 1px dashed #cbd5e1;
            font-size: 0.82rem;
            color: #475569;
        }
        .hint-badge {
            background: #f1f5f9;
            border-radius: 4px;
            padding: 0.15rem 0.4rem;
            font-family: monospace;
            font-weight: 600;
            color: #1e293b;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="login-header">
        <div class="login-icon">
            <i class="fa-solid fa-wheat-awn"></i>
        </div>
        <h1 class="login-title">AgroGestão Web</h1>
        <p class="login-subtitle">Acesso Seguro ao Sistema Integrado</p>
    </div>

    <!-- Mensagens de Erro ou Logout -->
    <div th:if="${param.erro}" class="alert-box alert-danger">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span>Usuário ou senha inválidos. Tente novamente.</span>
    </div>

    <div th:if="${param.logout}" class="alert-box alert-success">
        <i class="fa-solid fa-circle-check"></i>
        <span>Você encerrou a sessão com sucesso!</span>
    </div>

    <!-- Formulário do Spring Security -->
    <form th:action="@{/login}" method="post">
        <div class="form-group" style="margin-bottom: 1.2rem;">
            <label class="form-label" for="username">Usuário / Login</label>
            <input type="text" id="username" name="username" class="form-input" placeholder="Digite seu login" required autofocus>
        </div>

        <div class="form-group" style="margin-bottom: 1.5rem;">
            <label class="form-label" for="password">Senha de Acesso</label>
            <input type="password" id="password" name="password" class="form-input" placeholder="Digite sua senha" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 0.8rem;">
            <i class="fa-solid fa-right-to-bracket"></i> Acessar Sistema
        </button>
    </form>

    <!-- Demonstração de Perfis para Defesa Oral -->
    <div class="credentials-hint">
        <p style="margin: 0 0 0.5rem 0; font-weight: 600; color: #1E3B2F;">
            <i class="fa-solid fa-id-card-clip"></i> Perfis Cadastrados (Edital):
        </p>
        <div style="display: flex; flex-direction: column; gap: 0.4rem;">
            <div>
                <strong>Admin:</strong> <span class="hint-badge">admin</span> / <span class="hint-badge">admin123</span>
                <span style="font-size: 0.76rem; color: #64748b;">(Acesso total e exclusão)</span>
            </div>
            <div>
                <strong>Operador:</strong> <span class="hint-badge">operador</span> / <span class="hint-badge">operador123</span>
                <span style="font-size: 0.76rem; color: #64748b;">(Cadastra e visualiza)</span>
            </div>
        </div>
    </div>
</div>

</body>
</html>
